name: Deploy

# Push to main only: test → deploy → smoke test, in that order, each gated
# on the previous one passing. Pull requests are covered separately by
# e2e.yml so the same 17 tests don't run twice on every push to main.
#
# Requires three repo secrets (Settings → Secrets and variables → Actions),
# none of which exist yet in this repo:
#   VERCEL_TOKEN      — vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID     — from `vercel link` locally (writes .vercel/project.json),
#                       or Vercel project → Settings → General
#   VERCEL_PROJECT_ID — same source as above
# Until those are set, the deploy/smoke-test jobs below will fail at the
# `vercel pull` step with an auth error — that's expected, not a bug in this
# workflow; it just means the account-linking step (outside this file's
# scope) hasn't happened yet.
on:
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel's own build, not `npm run build`)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: curl the deployed URL, expect 200
        run: |
          url="${{ needs.deploy.outputs.url }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "GET $url -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::Deployed URL returned $status, expected 200"
            exit 1
          fi
